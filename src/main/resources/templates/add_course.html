<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Course — Academia</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
  <a th:href="@{/}" class="brand">Academia</a>
  <nav>
    <a th:href="@{/view/students}">Students</a>
    <a th:href="@{/view/courses}">Courses</a>
    <a th:href="@{/view/departments}">Departments</a>
  </nav>
  <div class="nav-right">
    <a th:href="@{/dashboard}" style="color:rgba(255,255,255,.7);text-decoration:none;font-size:14px">← Dashboard</a>
  </div>
</nav>

<div class="container">
  <div class="page-title" style="margin-top:8px">Add Course</div>

  <div class="card form" style="max-width:540px">
    <!--
      POST /teacher/course/create → TeacherWebController#createCourse
      Params: name, departmentId
      Teacher is auto-assigned from the logged-in security principal
    -->
    <form th:action="@{/teacher/course/create}" method="post">

      <label>Course Name</label>
      <input type="text" name="name" placeholder="e.g. Introduction to Computer Science" required/>

      <label>Department</label>
      <select name="departmentId" required>
        <option value="" disabled selected>Select a department…</option>
        <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
      </select>

      <button type="submit">Create Course</button>
    </form>
  </div>
</div>

</body>
</html>
