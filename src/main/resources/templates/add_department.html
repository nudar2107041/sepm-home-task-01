<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Department — Academia</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
  <a th:href="@{/}" class="brand">Academia</a>
  <nav>
    <a th:href="@{/view/students}">Students</a>
    <a th:href="@{/view/courses}">Courses</a>
    <a th:href="@{/view/departments}">Departments</a>
  </nav>
  <div class="nav-right">
    <a th:href="@{/dashboard}" style="color:rgba(255,255,255,.7);text-decoration:none;font-size:14px">← Dashboard</a>
  </div>
</nav>

<div class="container">
  <div class="page-title" style="margin-top:8px">Add Department</div>

  <div class="card form" style="max-width:480px">
    <!--
      POST /teacher/department/create → TeacherWebController#createDepartment
      Param: name
    -->
    <form th:action="@{/teacher/department/create}" method="post">

      <label>Department Name</label>
      <input type="text" name="name" placeholder="e.g. Computer Science" required/>

      <button type="submit">Create Department</button>
    </form>
  </div>
</div>

</body>
</html>
